name: Validate

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
      - default.json
      - renovate.json
      - actions-lock.json
      - renovate.json5
  push:
    branches:
      - main
    paths:
      - .github/workflows/*.yml
      - default.json
      - renovate.json
      - actions-lock.json
      - renovate.json5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow files
        # https://github.com/rhysd/actionlint/blob/v1.7.12/docs/usage.md#use-actionlint-on-github-actions
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  renovate-validate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Renovate config
        uses: docker://ghcr.io/renovatebot/renovate:44.206.2@sha256:d515a99f5d14d1c62b792ee61339d165dd9d20ee82ca9d5379daf639050bab51
        with:
          entrypoint: renovate-config-validator
          args: --no-global default.json renovate.json5 actions-lock.json renovate.json
