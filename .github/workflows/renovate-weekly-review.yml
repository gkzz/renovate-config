name: Renovate Weekly Review

on:
  schedule:
    # Run after the shared Renovate Monday window in JST.
    - cron: "0 0 * * 2"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Repositories to review, separated by commas, spaces, or newlines. Defaults to vars.RENOVATE_REVIEW_REPOSITORIES or this repository."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: renovate-weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect Renovate review context
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_REVIEW_TOKEN || github.token }}
          INPUT_REPOSITORIES: ${{ inputs.repositories }}
          DEFAULT_REPOSITORIES: ${{ vars.RENOVATE_REVIEW_REPOSITORIES }}
        run: |
          set -euo pipefail

          repositories="${INPUT_REPOSITORIES:-}"
          if [ -z "$repositories" ]; then
            repositories="${DEFAULT_REPOSITORIES:-}"
          fi
          if [ -z "$repositories" ]; then
            repositories="${GITHUB_REPOSITORY}"
          fi

          printf "%s\n" "$repositories" | tr ", " "\n" | sed "/^$/d" > repositories.txt

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generatedAt: $generatedAt, repositories: []}' \
            > renovate-review-context.json

          while IFS= read -r repository; do
            dashboards="$(
              gh api -X GET "repos/${repository}/issues" \
                -f state=open \
                -f per_page=100 \
                --jq '[.[] | select(.pull_request | not) | select(.title | test("Dependency Dashboard"; "i")) | {
                  type: "dependency-dashboard",
                  number,
                  title,
                  body,
                  url: .html_url,
                  updatedAt: .updated_at,
                  labels: [.labels[].name]
                }]'
            )"

            pull_requests="$(
              gh pr list \
                --repo "$repository" \
                --state open \
                --label renovate \
                --limit 100 \
                --json number,title,body,url,headRefName,baseRefName,mergeStateStatus,reviewDecision,statusCheckRollup,labels,isDraft,updatedAt \
              | jq 'map(. + {type: "renovate-pr"})'
            )"

            tmp="$(mktemp)"
            jq \
              --arg repository "$repository" \
              --argjson dashboards "$dashboards" \
              --argjson pullRequests "$pull_requests" \
              '.repositories += [{
                name: $repository,
                dependencyDashboards: $dashboards,
                renovatePullRequests: $pullRequests
              }]' \
              renovate-review-context.json > "$tmp"
            mv "$tmp" renovate-review-context.json
          done < repositories.txt

          jq . renovate-review-context.json

      - name: Check for review targets
        id: targets
        run: |
          set -euo pipefail

          count="$(
            jq '[.repositories[] | (.dependencyDashboards + .renovatePullRequests) | length] | add // 0' \
              renovate-review-context.json
          )"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Run Codex review
        id: run_codex
        if: steps.targets.outputs.count != '0'
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bots: true
          prompt-file: .github/prompts/renovate-weekly-review.md
          output-file: renovate-weekly-review.json
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["reviews"],
              "properties": {
                "reviews": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["repository", "targetType", "number", "decision", "body"],
                    "properties": {
                      "repository": {
                        "type": "string",
                        "pattern": "^[^/]+/[^/]+$"
                      },
                      "targetType": {
                        "type": "string",
                        "enum": ["issue", "pull_request"]
                      },
                      "number": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "decision": {
                        "type": "string",
                        "enum": ["create-pr", "merge", "hold", "manual-check", "skip"]
                      },
                      "body": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 2000
                      }
                    }
                  }
                }
              }
            }

      - name: Comment on Renovate issues and pull requests
        if: steps.targets.outputs.count != '0'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW_TOKEN: ${{ secrets.RENOVATE_REVIEW_TOKEN || github.token }}
        with:
          github-token: ${{ env.REVIEW_TOKEN }}
          script: |
            const fs = require("fs");

            const marker = "<!-- codex-renovate-weekly-review -->";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const result = JSON.parse(fs.readFileSync("renovate-weekly-review.json", "utf8"));

            for (const review of result.reviews) {
              const [owner, repo] = review.repository.split("/");
              const issue_number = review.number;
              const body = [
                marker,
                review.body.trim(),
                "",
                `Review run: ${runUrl}`,
              ].join("\n");

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments
                .filter((comment) => comment.user?.type === "Bot")
                .reverse()
                .find((comment) => comment.body?.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            }
